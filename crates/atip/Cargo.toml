[package]
name = "atip"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "The atip/1 contract pieces a command-line tool shares, up to 1.6: the generic projection of a clap tree onto the self-description documents and their serializer for the minor a tool declares, the error value and its redaction, the error-code row type and the code-name convention, JSON-mode detection and the one-line envelope output, the shell quoting and splitting of next-step commands, and the contract's own JSON Schemas with a validator for envelopes."
readme = "README.md"
keywords = ["cli", "json", "clap", "agent", "contract"]
categories = ["command-line-interface"]
# The published crate: the sources and the schemas they embed. The tests read the repository around the crate
# (`../../examples`, `../../schema`) and stay in the repository.
include = ["/src/**", "/schema/*.json", "/README.md"]

[lib]
name = "atip"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
# `float_roundtrip`: a number written with digits is read as the nearest double, so a digest of it is the same as every other
# implementation's (spec 12.6, the plan digest vectors). The feature is additive and applies to every crate of the workspace.
serde_json = { workspace = true, features = ["float_roundtrip"] }
schemars = { workspace = true }
# A JSON Schema validator, only with the feature `validate`: the checks of the contract's schemas (`schema::envelope_problems`
# and the other `*_problems`), the validation of a projected answer (`fields::projected_problems`) and the compiled domain
# (`domain::compile`). A tool that only builds documents and refuses arguments does not link it.
jsonschema = { version = "0.47.0", default-features = false, optional = true }
# The Rust reading of a domain `pattern` (spec 10.7.4): a pattern must compile with the crate's default limits, and
# `domain::admits` judges a `pattern` with it.
regex = "1"
# The syntax tree of a domain `pattern`, to tell whether it can match a `,` (a comma list's domain cannot, spec 9.7.6).
regex-syntax = "0.8"
# The SHA-256 of a cursor's binding and of a plan digest (`cursor`, `plan`).
sha2 = { workspace = true }

[features]
default = []
# The JSON Schema validation of documents (see `jsonschema` above). The checker and every test turn it on.
validate = ["dep:jsonschema"]

[dev-dependencies]
# The crate's own `validate` feature, for its tests (`cargo test -p atip` tests the validators too).
atip = { path = ".", features = ["validate"] }
# The synthetic tree of `examples/describe_bench.rs` names its options at run time.
clap = { workspace = true, features = ["string"] }

[lints]
workspace = true
