name: CI

# One job per OS, the same steps `just ci` runs locally, in the same order:
#   scripts/validate.sh                      the examples against the schemas, the spec's cross-references, the plan digest
#                                            vectors and the Rust column of the pattern record (scripts/regex-parity)
#   scripts/check_visibility.sh              no pub(super) / pub(in ..) in crate sources
#   cargo fmt --check                        formatting
#   cargo clippy --workspace -D warnings     lints (the lint set is [workspace.lints] in Cargo.toml)
#   scripts/check_no_jsonschema.sh           cargo tree: `atip`'s default features and `atip-probe` pull no jsonschema
#   cargo test --workspace                   the `atip` crate and the checker, with its fake tool
# and, on ubuntu only, one step `just ci` leaves out (`just package` runs it):
#   cargo package -p atip -p atip-check      the two published crates package and build from their own files alone (what
#                                            publish-crate.yml and publish-check.yml publish); it resolves against
#                                            crates.io, which a local source replacement of crates.io breaks
#
# A second job checks the checker's own claim, ATIP 1.6 L1, with the release binary (`just self-check`): every check of L1
# (`--deep`) against crates/atip-check/tests/self/atip.fixture.json, the binary's directory first on PATH, since that
# fixture's `ok` call of `check` checks `atip` itself.
#
# The Rust toolchain is the one `rust-toolchain.toml` pins, installed with rustup (never a floating `stable`); the job fails
# when `rustc` is not that version. It runs on ubuntu and macOS: the checker needs a pseudo-terminal and process groups, and the
# two systems differ in exactly those. Bun 1.4.4 is the runtime the ECMAScript half of scripts/regex-cases.json was recorded with.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: validate, lint, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: atip-ci-${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo fetch --locked
        run: cargo fetch --locked

      - name: scripts/validate.sh
        run: scripts/validate.sh

      - name: scripts/check_visibility.sh
        run: scripts/check_visibility.sh

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: scripts/check_no_jsonschema.sh
        run: scripts/check_no_jsonschema.sh

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: cargo package (the published crates)
        if: runner.os == 'Linux'
        run: cargo package -p atip -p atip-check --locked

  self-check:
    name: atip check of atip (ATIP 1.6 L1)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: atip-self-check-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo build --release
        run: cargo build --release --locked -p atip-check --bin atip

      - name: atip check --level L1 --deep --contract 1.6
        run: |
          PATH="$PWD/target/release:$PATH" atip check --bin atip \
            --fixture crates/atip-check/tests/self/atip.fixture.json --level L1 --deep --contract 1.6
