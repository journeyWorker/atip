name: CI

# One job per OS, the same steps `just ci` runs locally, in the same order:
#   scripts/validate.sh                      the examples against the schemas, the spec's cross-references, the plan digest
#                                            vectors and the Rust column of the pattern record (scripts/regex-parity)
#   scripts/check_visibility.sh              no pub(super) / pub(in ..) in crate sources
#   cargo fmt --check                        formatting
#   cargo clippy --workspace -D warnings     lints (the lint set is [workspace.lints] in Cargo.toml; docs/rust-coding-rules.md),
#                                            then `atip` alone without its `validate` feature
#   scripts/check_no_jsonschema.sh           cargo tree: `atip`'s default features and `atip-probe` pull no jsonschema
#   cargo test --workspace                   the `atip` crate and the checker, with its fake tool
# and, on ubuntu only, one step `just ci` leaves out (`just package` runs it):
#   cargo package -p atip -p atip-check      the two published crates package and build from their own files alone (what
#                                            publish-crate.yml and publish-check.yml publish); it resolves against
#                                            crates.io, which a local source replacement of crates.io breaks
#
# A second job checks the checker's own claim, ATIP 1.6 L2, with the release binary (`just self-check`): every check of L2
# (`--deep`) against crates/atip-check/tests/self/atip.fixture.json, the binary's directory first on PATH, since that
# fixture's `ok` call of `check` checks `atip` itself. A third job runs `cargo deny --locked check` (deny.toml): RustSec
# advisories, licenses, bans and sources, with a pinned cargo-deny whose download is checked against its SHA-256. A fourth
# job builds and tests the published library `atip` on its own floor, the `rust-version` of crates/atip/Cargo.toml (`just
# msrv`; docs/rust-coding-rules.md).
#
# The Rust toolchain is the one `rust-toolchain.toml` pins, installed with rustup (never a floating `stable`); the job fails
# when `rustc` is not that version. It runs on ubuntu and macOS: the checker needs a pseudo-terminal and process groups, and the
# two systems differ in exactly those. Bun 1.4.4 is the runtime the ECMAScript half of scripts/regex-cases.json was recorded with.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: validate, lint, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: atip-ci-${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo fetch --locked
        run: cargo fetch --locked

      - name: scripts/validate.sh
        run: scripts/validate.sh

      - name: scripts/check_visibility.sh
        run: scripts/check_visibility.sh

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo clippy -p atip --lib (default features)
        run: cargo clippy -p atip --lib --locked -- -D warnings

      - name: scripts/check_no_jsonschema.sh
        run: scripts/check_no_jsonschema.sh

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: cargo package (the published crates)
        if: runner.os == 'Linux'
        run: cargo package -p atip -p atip-check --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

      - name: cargo deny --locked check
        run: PATH="$HOME/.cargo/bin:$PATH" cargo deny --locked check

  msrv:
    name: atip on its rust-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      # The release the library declares, read from its manifest so the two cannot drift; rustup resolves `1.99` to the
      # newest 1.99.x.
      - name: Install the rust-version of crates/atip
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          msrv=$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' crates/atip/Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      # The library with its default features (no `validate`: what a tool that only describes itself links), then with
      # `validate`, then its tests, which turn `validate` on through the crate's own dev-dependency.
      - name: cargo build -p atip on the rust-version (default features, then validate)
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo "+$MSRV" build -p atip --locked
          cargo "+$MSRV" build -p atip --features validate --locked

      - name: cargo test -p atip on the rust-version
        run: PATH="$HOME/.cargo/bin:$PATH" cargo "+$MSRV" test -p atip --locked

  self-check:
    name: atip check of atip (ATIP 1.6 L2)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: atip-self-check-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo build --release
        run: cargo build --release --locked -p atip-check --bin atip

      - name: atip check --level L2 --deep --contract 1.6
        run: |
          PATH="$PWD/target/release:$PATH" atip check --bin atip \
            --fixture crates/atip-check/tests/self/atip.fixture.json --level L2 --deep --contract 1.6
