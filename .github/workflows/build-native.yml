name: Build native

# The `atip` binary (crate atip-check) for each platform the npm packages ship, built natively on a runner of that
# platform (no cross-compilation). Each row stages the binary into its npm package directory, runs it through the npm
# launcher (`npm/atip-check/bin.js`: the version it prints and an exit status it passes on), and uploads it with its SHA-256.
#
# publish-check.yml calls this workflow (`workflow_call`) and publishes what it uploads, so the release builds exactly
# these rows; there is no second copy of the matrix to drift. A pull request that changes the build inputs, the npm
# packages or the workflows runs it too, so a platform that stops building shows before a release tag does (ci.yml
# already tests the code on ubuntu x64 and macOS arm64).
#
# The checker is unix-only (a pseudo-terminal, process groups): no Windows row. The Linux binaries link the glibc of
# their runner image, so they are built on Ubuntu 22.04 (glibc 2.35) to run on that and every later glibc.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/atip/Cargo.toml"
      - "crates/atip-check/Cargo.toml"
      - "npm/**"
      - ".github/workflows/build-native.yml"
      - ".github/actions/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build - ${{ matrix.platform }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            platform: darwin-arm64
          - host: ubuntu-22.04
            platform: linux-x64
          - host: ubuntu-22.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: atip-release-${{ matrix.platform }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build the atip binary
        run: cargo build --locked --release -p atip-check

      - name: Strip and stage into npm/atip-check-${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          strip target/release/atip
          mkdir -p "npm/atip-check-$PLATFORM/bin"
          cp target/release/atip "npm/atip-check-$PLATFORM/bin/atip"
          chmod +x "npm/atip-check-$PLATFORM/bin/atip"
          cd "npm/atip-check-$PLATFORM/bin"
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 atip > atip.sha256
          else
            sha256sum atip > atip.sha256
          fi
          cat atip.sha256

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # The launcher finds the platform package as its sibling directory here, as it finds the installed package
      # next to it after `npm install`.
      - name: Run the binary through the npm launcher
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' crates/atip-check/Cargo.toml)
          got=$(node npm/atip-check/bin.js --version)
          if [ "$got" != "atip $version" ]; then
            echo "::error::the launcher printed '$got', expected 'atip $version'" >&2
            exit 1
          fi
          status=0
          node npm/atip-check/bin.js no-such-command >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 2 ]; then
            echo "::error::an unknown command exited $status through the launcher, expected the binary's 2" >&2
            exit 1
          fi
          echo "$got; an unknown command exits 2 through the launcher"

      - name: Upload the binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atip-check-${{ matrix.platform }}
          path: |
            npm/atip-check-${{ matrix.platform }}/bin/atip
            npm/atip-check-${{ matrix.platform }}/bin/atip.sha256
          if-no-files-found: error
