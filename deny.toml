# cargo-deny's policy for the dependency graph. CI runs `cargo deny --locked check`; docs/rust-coding-rules.md records the
# decisions. An exception names its crate, or its advisory id, with the reason.

[graph]
all-features = false

[advisories]
# RustSec advisories fail the check. An ignored one needs its id and a reason:
#   ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "why it does not apply, and until when" }]
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
]

# One crate's extra license each, never a repo-wide widening. Both are OSI-approved permissive licenses.
[[licenses.exceptions]]
# Through jsonschema (referencing, fluent-uri): borrow-or-share is MIT No Attribution.
crate = "borrow-or-share"
allow = ["MIT-0"]

[[licenses.exceptions]]
# Through jsonschema (referencing, hashbrown): foldhash is zlib.
crate = "foldhash"
allow = ["Zlib"]

[licenses.private]
# Unpublished workspace crates (publish = false) are not license-checked.
ignore = true

[bans]
# A second version of a crate fails the check unless it is listed here with the reason it cannot be one version yet.
multiple-versions = "deny"
skip = [
  # jsonschema 0.47 (ahash, referencing) is on getrandom 0.3, tempfile 3.27 on 0.4; one version when jsonschema moves.
  { crate = "getrandom@0.3.4", reason = "jsonschema 0.47 pulls getrandom 0.3 through ahash; tempfile needs 0.4" },
  { crate = "r-efi@5.3.0", reason = "the UEFI dependency of getrandom 0.3 (above); getrandom 0.4 takes r-efi 6" },
]
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
